<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Outer Luxury Rim: Emerald -> Cyan -> Indigo -> Violet -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Top Specular Glass Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- "T" Tech Indigo Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- "W" Growth Emerald Gradient -->
    <linearGradient id="wGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Ambient Center Glow Behind Glyphs -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#centerGlow)" />

  <!-- Outer Rounded Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" 
        fill="url(#bgGrad)" 
        stroke="url(#rimGrad)" 
        stroke-width="5" />

  <!-- Top Glass Highlight Overlay -->
  <path d="M 28 136 C 28 76 76 28 136 28 L 376 28 C 436 28 484 76 484 136 L 484 205 C 330 175 180 185 28 255 Z" 
        fill="url(#glassGrad)" />

  <!-- Inner Stroke Highlight -->
  <rect x="30" y="30" width="452" height="452" rx="106" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.08)" 
        stroke-width="1.5" />

  <!-- THE GLYPH COMPOSITION -->
  <g id="tw-glyph" transform="translate(6, 0)">
    <!-- "T" Monogram: Solid Architectural Anchor -->
    <!-- Top Bar -->
    <path d="M 68 152 L 208 152 C 216 152 222 158 222 166 L 222 176 C 222 184 216 190 208 190 L 158 190 L 158 356 C 158 366 150 374 140 374 L 118 374 C 108 374 100 366 100 356 L 100 190 L 68 190 C 60 190 54 184 54 176 L 54 166 C 54 158 60 152 68 152 Z" 
          fill="url(#tGrad)" />

    <!-- "W" Continuous Stroke -->
    <polyline points="190,204 232,358 274,264 322,358 411,182" 
              fill="none" 
              stroke="url(#wGrad)" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round" />

    <!-- Sleek Supersonic Arrowhead with Exact Trigonometric Alignment -->
    <polygon points="434,136 444,210 411,182 374,180" 
             fill="url(#wGrad)" />
  </g>
</svg>