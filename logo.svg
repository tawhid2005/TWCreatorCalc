<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Stroke Gradient (Emerald to Indigo to Purple) -->
    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Indigo Tech Gradient -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="64" cy="64" r="48" fill="#6366F1" opacity="0.18" filter="url(#subtleGlow)" />
  <circle cx="80" cy="50" r="32" fill="#10B981" opacity="0.16" filter="url(#subtleGlow)" />

  <!-- Outer Hexagonal Badge -->
  <!-- Hexagon points: (64, 8), (112, 36), (112, 92), (64, 120), (16, 92), (16, 36) with rounded joints -->
  <polygon points="64,10 114,39 114,97 64,126 14,97 14,39" 
           fill="url(#bgGrad)" 
           stroke="url(#hexBorderGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#neonGlow)" />

  <!-- Inner Subtle Hex Outline -->
  <polygon points="64,17 108,42 108,93 64,118 20,93 20,42" 
           fill="none" 
           stroke="rgba(255, 255, 255, 0.08)" 
           stroke-width="1.2" 
           stroke-linejoin="round" />

  <!-- MONOGRAM "TW" + FINANCIAL GROWTH GEOMETRY -->
  
  <!-- "T" Crossbar & Stem -->
  <!-- Top T bar -->
  <path d="M 28 38 L 74 38 C 76.5 38 78 39.8 77 42 L 73.5 49 C 72.8 50.2 71.5 51 70 51 L 56 51 L 56 80 C 56 82 54 84 52 84 L 46 84 C 44 84 42 82 42 80 L 42 51 L 30 51 C 28.5 51 27.2 50.2 26.5 49 L 23 42 C 22 39.8 23.5 38 28 38 Z" 
        fill="url(#techGrad)" 
        opacity="0.95" />

  <!-- "W" Right Interlock with Financial Upward Vector -->
  <!-- W shape starting from middle and angling up with arrowhead -->
  <path d="M 47 62 L 57 88 C 57.8 90 60.2 90 61 88 L 72 61 C 72.6 59.5 74.4 59.5 75 61 L 86 88 C 86.8 90 89.2 90 90 88 L 102 54 C 102.5 52.5 101.5 51 100 51 L 93 51 C 91.8 51 90.8 51.8 90.4 53 L 83.5 74 L 76.5 55 C 75.8 53.2 73.2 53.2 72.5 55 L 65.5 74 L 58.6 53 C 58.2 51.8 57.2 51 56 51 L 49 51 C 47.5 51 46.5 52.5 47 54 Z"
        fill="url(#growthGrad)"
        filter="url(#neonGlow)" />

  <!-- Upward Financial Growth Arrow Surge -->
  <path d="M 68 84 L 88 58 L 96 66 L 104 42 L 78 48 L 86 56 L 68 78 Z" 
        fill="#34D399" 
        opacity="0.9" />

  <!-- Creator Play Button Triangle (Upper Right) -->
  <path d="M 86 34 L 102 43 C 103.5 44 103.5 46 102 47 L 86 56 C 84.5 57 83 56 83 54 L 83 36 C 83 34 84.5 33 86 34 Z" 
        fill="url(#hexBorderGrad)" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="1"
        filter="url(#neonGlow)" />

  <!-- Financial Candlestick / Bar Columns at the bottom -->
  <rect x="36" y="94" width="4" height="12" rx="1.5" fill="#6366F1" opacity="0.6" />
  <rect x="44" y="90" width="4" height="16" rx="1.5" fill="#818CF8" opacity="0.8" />
  <rect x="52" y="85" width="4" height="21" rx="1.5" fill="#38BDF8" opacity="0.85" />
  <rect x="60" y="81" width="4" height="25" rx="1.5" fill="#34D399" opacity="0.95" />
  <rect x="68" y="74" width="4" height="32" rx="1.5" fill="#10B981" />
  <rect x="76" y="70" width="4" height="36" rx="1.5" fill="#10B981" filter="url(#neonGlow)" />
  <rect x="84" y="66" width="4" height="40" rx="1.5" fill="#34D399" filter="url(#neonGlow)" />
</svg>
